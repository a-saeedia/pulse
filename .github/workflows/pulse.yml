name: pulse

on:
  schedule:
    # 06:43 UTC daily. Off the top of the hour on purpose: GitHub's scheduler
    # queues at :00 and can drop runs under load.
    - cron: "43 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pulse.mjs

      - name: Commit
        run: |
          git config user.name "Arman Saeedi"
          git config user.email "149491112+a-saeedia@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore: pulse $(date -u +%F)"
            git push
          fi
